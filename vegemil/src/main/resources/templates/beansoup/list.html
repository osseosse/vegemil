<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<th:block class="white" th:replace="fragments/beansoup/head :: headFragment"></th:block>
<script>
	$(document).ready(function() {
		$('#btnSearch').click(function() {
			var word = $('#txtSearch').val();
			if (word == "" || word == null) {
				alert("검색어를 입력하세요.");
				return false;
			}
		});

		function onKeydownEnterKey(obj) {
			if (event.keycode == 13) {
				self.focus();
				obj.click();

				return false;
			}
		}

	});

	// 카테고리 버튼: 서버 재요청 없이 이미 내려받은 전체 목록을 Isotope 필터로만 전환한다.
	// (Isotope가 아이템을 절대좌표로 배치하므로, 단순 show/hide 대신 filter 옵션을 통해 재배치까지 맡겨야 화면이 안 틀어진다)
	function applyCateFilter(tag) {
		var $buttons = $('.messonry-button2 button');
		$buttons.removeClass('is-checked');
		var $target = tag ? $buttons.filter(function() { return $(this).data('tag') === tag; }) : $('.cate0');
		$target.addClass('is-checked');

		var $grid = $('#originList');
		if ($grid.data('isotope')) {
			$grid.isotope({
				filter: function() {
					if (!tag) return true;
					var cate = String($(this).data('cate') || '');
					return cate.indexOf(tag) !== -1;
				}
			});
		} else {
			$grid.find('.portfolio').each(function() {
				var cate = String($(this).data('cate') || '');
				$(this).toggle(!tag || cate.indexOf(tag) !== -1);
			});
		}
	}

	$(window).on('load', function() {
		$('.messonry-button2 button').on('click', function(e) {
			e.preventDefault();
			applyCateFilter($(this).data('tag') || '');
		});
	});

</script>
<script th:inline="javascript">
	/*<![CDATA[*/
      $(document).ready(function(){
    	var current = 'ㅡㅡ';
      	current = /*[[ ${tagSearched} ]]*/;

      	if (current != null) {
			$('#originList').hide();
			$('#searchList').show();
			$('#searchTotal').show();
			$('#resultWord').show();
		} else {
			var initialTag = /*[[ ${tag} ]]*/ null;
			if (initialTag) {
				$(window).on('load', function() {
					applyCateFilter(initialTag);
				});
			}
		}
	});
	/*]]>*/
</script>

<body>
	<!-- ================================ 
		        Header
        ================================ -->
	<th:block class="white" th:replace="fragments/beansoup/mainHeader :: headerFragment"></th:block>
	<!-- ================================ 
		        // Header
        ================================ -->
	<!-- ================================ 
		        Content
      ================================ -->
    <section class="mainSection">
	<!-- main Visual -->
	
		<!-- main Visual -->
		<div class="container100 clear" >
			<div class="row h500">
				<div class="col-lg-12 bg_pink">
					<div class="hCenter02">
						<!-- subSearch -->
						<div class="mainSearch w600 ">
						  <p class="f26 mt60">간단요리사와 함께, 우리집</p>
						  <p class="f50 tcenter fw600 black">간단레시피</p>
		
						  <div class="search-container clear mt30">
							<form id="Form1" method="post" action="">
							  <input type="text" class="in-search" name="txtSearchWord"
									id="txtSearch" placeholder="찾으시는 레시피를 검색해보세요." autofocus></input>
							  <button type="submit"><i class="fa fa-search"></i></button>
							</form> <div class="clear"></div>
						  </div>
						  <div class="clear"></div>
						  <ul class="mt20 key3">
							<li><a href="/beanSoup/list?tag=담백한 채소육수">#담백한 채소육수</a></li>
							<li><a href="/beanSoup/list?tag=시원한 채소육수">#시원한 채소육수</a></li>
							<li><a href="/beanSoup/list?tag=구수한 사골육수">#구수한 사골육수</a></li>
							<li><a href="/beanSoup/list?tag=콩국물">#콩국물</a></li>
						  </ul>
						</div>
						<!-- //subSearch -->
					</div>
				</div>
			</div>
		</div>  
		<!-- // main Visual -->
		<div class="container mt80">
			<div class="row">
				<div class="col-lg-12">
					<div class="messonry-button2 text-center pb30 ">
						<button data-tag="" class="cate0" th:classappend="${tag == null} ? 'is-checked' : ''"><span class="filter-text"></span><span class="filter-counter" th:text="${cateCountMap?.get('allCount')}">78</span>
						<p class="f16 f500 mt10" >전체</p></button>
						<button data-tag="맑은 국물" class="cate1" th:classappend="${tag == '맑은 국물'} ? 'is-checked' : ''">
							<span class="filter-text"></span>
							<span class="filter-counter" th:text="${cateCountMap?.get('맑은 국물')}">6</span>
							<p class="f16 f500 mt10">맑은 국물</p>
						</button>
						<button data-tag="진한 국물" class="cate2" th:classappend="${tag == '진한 국물'} ? 'is-checked' : ''">
							<span class="filter-text"></span>
							<span class="filter-counter" th:text="${cateCountMap?.get('진한 국물')}">11</span>
							<p class="f16 f500 mt10">진한 국물</p>
						</button>
						<button data-tag="봄" class="cate3" th:classappend="${tag == '봄'} ? 'is-checked' : ''"><span class="filter-text"></span> <span class="filter-counter" th:text="${cateCountMap?.get('봄')}">7</span><p class="f16 f500 mt10">봄</p></button>
						<button data-tag="여름" class="cate4" th:classappend="${tag == '여름'} ? 'is-checked' : ''"><span class="filter-text"></span> <span class="filter-counter" th:text="${cateCountMap?.get('여름')}">12</span><p class="f16 f500 mt10">여름</p></button>
						<button data-tag="가을" class="cate5" th:classappend="${tag == '가을'} ? 'is-checked' : ''"><span class="filter-text"></span> <span class="filter-counter" th:text="${cateCountMap?.get('가을')}">9</span><p class="f16 f500 mt10">가을</p></button>
						<button data-tag="겨울" class="cate6" th:classappend="${tag == '겨울'} ? 'is-checked' : ''"><span class="filter-text"></span> <span class="filter-counter" th:text="${cateCountMap?.get('겨울')}">12</span><p class="f16 f500 mt10">겨울</p></button>
						<button data-tag="우리집 파티" class="cate7" th:classappend="${tag == '우리집 파티'} ? 'is-checked' : ''"><span class="filter-text"></span> <span class="filter-counter" th:text="${cateCountMap?.get('우리집 파티')}">10</span><p class="f16 f500 mt10">우리집 파티</p></button>
						<button data-tag="아이와 함께" class="cate8" th:classappend="${tag == '아이와 함께'} ? 'is-checked' : ''"><span class="filter-text"></span> <span class="filter-counter" th:text="${cateCountMap?.get('아이와 함께')}">12</span><p class="f16 f500 mt10">아이와 함께</p></button>
						<button data-tag="채소를 듬뿍" class="cate9" th:classappend="${tag == '채소를 듬뿍'} ? 'is-checked' : ''"><span class="filter-text"></span> <span class="filter-counter" th:text="${cateCountMap?.get('채소를 듬뿍')}">11</span><p class="f16 f500 mt10">채소를 듬뿍</p></button>
						<button data-tag="고소한 간식" class="cate10"  th:classappend="${tag == '고소한 간식'} ? 'is-checked' : ''"><span class="filter-text"></span> <span class="filter-counter" th:text="${cateCountMap?.get('고소한 간식')}">8</span><p class="f16 f500 mt10">고소한 간식</p></button>
						<button data-tag="새로운 발견" class="cate11"  th:classappend="${tag == '새로운 발견'} ? 'is-checked' : ''"><span class="filter-text"></span> <span class="filter-counter" th:text="${cateCountMap?.get('새로운 발견')}">9</span><p class="f16 f500 mt10">새로운 발견</p></button>
					</div>

					<th:block th:if="${not #strings.isEmpty(search_result_html)}">
						<!-- listLine 은 밑줄만 그리는 요소라, 건수가 없으면 빈 줄만 남으므로 함께 감춘다 -->
						<div class="listLine mt30m" th:if="${search_html != null}">
							<div id="searchTotal">
								<div class='count'><p class='f16'>검색결과 <span class='green' th:text="${search_html}"></span> 조회</p></div>
							</div>
						</div>
						<div id="resultWord"><div class='mt50'><p class='f38 fw600 tcenter'><span class='green' th:text="${search_result_html}">'#채소'</span> 검색결과</p></div></div>
					</th:block>
					<div class="portfolio-grid-metro4 mesonry-list" id="searchList" style="display: none;">
						<div class="resizer"></div>
						<!-- <div id="DataList1"> -->
						<th:block th:each="item : ${searchList}">
							<div class="portfolio portfolio_style--1 portfolio-25">
								<div class="thumbBox">
									<a href="#" th:href="@{/beanSoup/detail(recipe=${item.fileNo})}">
										<!--pk:fileNo -->
										<div class="h220 round" th:classappend="${item.cssClass}"></div>
										<div class="recipeTxt_white">											
											<p class="f22 fw600 mt10" th:text="${item.name}">name</p>
										</div>
									</a>
								</div>
							</div>
						</th:block>
						<!-- </div> -->
					</div>
					<!-- 메인 전체리스트 -->
					<div class="portfolio-grid-metro4 mesonry-list" id="originList" style="display: block; ">
						<div class="resizer"></div>
						<!--나중에 th:block -> div로 바꿔보기 -->
						<th:block th:each="item : ${beansoupList}">
							<div class="portfolio portfolio_style--1 portfolio-25"
								th:attr="data-cate=${(item.nCatea ?: '') + '|' + (item.nCateb ?: '') + '|' + (item.nCatec ?: '') + '|' + (item.nCated ?: '') + '|' + (item.nCatef ?: '') + '|' + (item.nCateg ?: '') + '|' + (item.nCateh ?: '') + '|' + (item.product ?: '')}">
								<div class="thumbBox">
									<a th:href="|/beanSoup/detail?recipe=${item.fileNo}|">
										<!--pk:fileNo -->
										<div class="h220 round" th:classappend="${item.cssClass}"></div>
										<div class="recipeTxt_white">
											<!-- <p class="f16 gray" th:text="${item.tag}">tag</p> -->
											<p class="f22 fw600 mt10" th:text="${item.name}">name</p>
										</div>
									</a>
								</div>
							</div>
						</th:block>
					</div>
					<th:block th:if="${search_html == '0건'}">
						<div class=" text-center" style="height:250px;">
						<p class="f30 gray my-5 pt-3 pb-5 mb-4">검색 결과가 없습니다.<br></p>
						</div>
					</th:block>
					<!-- 메인 전체리스트 끝끝-->
				</div>
			</div>			           
		</div>
	</section>
	<!-- //container -->
	<!-- ================================ 
		        // Content
        ================================ -->
	<!-- ================================ 
		        Footer
        ================================ -->
	<footer  th:replace="fragments/beansoup/mainFooter :: footerFragment"></footer>

</body>
</html>
