<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" 
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
	layout:decorator="admin/layout/dataLayout">
	
	<th:block layout:fragment="title">
		<title>비즈니스 문의 관리자</title>
	</th:block>
	
	<th:block layout:fragment="add-css">
	</th:block>
	

	<!-- BEGIN: Page Vendor JS-->
	<th:block layout:fragment="add-script">		
- 	    <script th:src="@{/app-assets/admin/customer/bizProposal.js}"></script>	    	        -
	    <script th:src="@{/app-assets/admin/common/jquery.serializeObject.min.js}"></script>
	    <script th:src="@{/app-assets/admin/common/common.js}"></script>	    
    </th:block>
    <!-- END: Page Vendor JS-->
	

	<th:block layout:fragment="content">
        <!-- BEGIN: Content-->
    <div class="app-content content ">
        <div class="content-overlay"></div>
        <div class="header-navbar-shadow"></div>
        <div class="content-wrapper container-xxl p-0">
            <div class="content-header row">
                <div class="content-header-left col-md-9 col-12 mb-2">
                    <div class="row breadcrumbs-top">
                        <div class="col-12">
                            <h2 class="content-header-title float-start mb-0">비즈니스 문의</h2>
                            <div class="breadcrumb-wrapper">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a href="index.html">Home</a>
                                    </li>
                                    <li class="breadcrumb-item"><a href="#">고객관리</a>
                                    </li>
                                    <li class="breadcrumb-item active">비즈니스</li>
                                </ol>
                            </div>
                        </div>
                    </div>
                </div>
              
            </div>
            <div class="content-body">
            	<form name="frm" id="frm">
	                <!-- Analytics card section -->
	                <section id="analytics-card">
						 <div class="row">
							<!-- 조회 -->
							<div class="col-md-12 col-12">
								<div class="card">
									<div class="card-header">
										<h4 class="card-title">조회</h4>
									</div>
									<div class="card-body">
										<div class="row mb-1">
											<div class="col-md-1 col-12">
												등록일
											</div>
	
											<div class="col-md-4 col-12">
	                                            <div class="btn-group" role="group" aria-label="Basic radio toggle button group">
	                                                <input type="radio" class="btn-check" name="btnradio1" id="btnradio1-1" onclick="javascript:selInsertDate(0);" autocomplete="off" checked />
	                                                <label class="btn btn-outline-primary" for="btnradio1-1">오늘</label>
	
	                                                <input type="radio" class="btn-check" name="btnradio1" id="btnradio1-2" onclick="javascript:selInsertDate(1);" autocomplete="off" />
	                                                <label class="btn btn-outline-primary" for="btnradio1-2">1개월</label>
	
	                                                <input type="radio" class="btn-check" name="btnradio1" id="btnradio1-3" onclick="javascript:selInsertDate(2);" autocomplete="off" />
	                                                <label class="btn btn-outline-primary" for="btnradio1-3">3개월</label>
	
													<input type="radio" class="btn-check" name="btnradio1" id="btnradio1-4" onclick="javascript:selInsertDate(3);" autocomplete="off" />
	                                                <label class="btn btn-outline-primary" for="btnradio1-4">6개월</label>
	
													<input type="radio" class="btn-check" name="btnradio1" id="btnradio1-5" onclick="javascript:selInsertDate(4);" autocomplete="off" />
	                                                <label class="btn btn-outline-primary" for="btnradio1-5">1년</label>
	                                            </div>
											</div>
											<div class="col-md-3 col-12">
												<input type="text" id="fp-range" class="form-control flatpickr-range" placeholder="YYYY-MM-DD to YYYY-MM-DD" />
											</div>
										</div>
										<div class="row mb-1 ">
									
											<div class="col-md-1 col-12">카테고리</div>
											<div class="col-md-2 col-12">																										
												<select class="form-select" id="searchType" name="searchType">
													<option value="">선택</option>
													<option value="companyName">업체명</option>
													<option value="personInCharge">담당자</option>
									
												</select>
											</div>
										</div>
										<div class="row mb-1">
											<div class="col-md-1 col-3">
												상세검색
											</div>
											<div class="col-md-4 col-4">
												<input type="text" id="searchKeyword" class="form-control" name="searchKeyword" placeholder="제목, 본문에 포함된 된어를 입력하세요" />
											</div>
										</div>
										<hr />
										<div class="row">
											 <div class="col-sm-12">
												<button type="button" onclick="javascript:createTable();" class="btn btn-primary me-1">조회</button>
												<button type="reset" class="btn btn-outline-secondary">초기화</button>
												<input type="hidden" class="form-control" name="sStartdate" id="sStartdate" value=""/>
												<input type="hidden" class="form-control" name="sEnddate" id="sEnddate" value=""/>
											</div>
										</div>
									</div>
								</div>
							</div>
							<!-- //조회 -->
	                    </div>
	                </section>
	                <!--/ Analytics Card section -->
	            </form>

				<form id="form" name="form" method="POST">
					<!-- FAQ리스트 -->
					<section id="basic-horizontal-layouts">
						<div class="row" >
							<div class="col-12">
								<div class="card">								
									<div class="table-responsive">
										<table class="datatables-basic table table-bordered text-start listTable mt-10 paddingType">
											<colgroup>
	
												<col width="3%"><!-- 아이디 -->
												<col width="10%"><!-- 업체명 -->
												<col width="10%"><!--  담당자 -->
												<col width="10%"><!-- 연락처  -->
												<col width="10%"><!-- 이메일 -->
												<col width="10%"><!-- 품목 -->
												<col width="23%"><!-- 제목 -->
												<col width="15%"><!-- 등록일시 -->		
												<col width="5%"><!-- IP -->
												<col width="1%"><!-- 답변 -->
	
											</colgroup>
											<thead>
												<tr>
																			
													<th>Id</th>
													<th>업체명</th>
													<th>담당자</th>
													<th>연락처</th>
													<th>이메일</th>
													<th>품목</th>
													<th>제목</th>
													<th>등록일시</th>
													<th>IP</th>
													<th>답변</th>
																								
												</tr>
											</thead>
										</table>
									</div>
	
								</div>
							</div>
						</div>
	                </section>
					<!-- //FAQ리스트 -->
				</form>
            </div>
        </div>
    </div>
    <!-- END: Content-->

	<!-- 모달 -->
	<div class="modal fade" id="contentModal" tabindex="-1" aria-hidden="true">
	  <div class="modal-dialog modal-lg modal-dialog-centered">
	    <div class="modal-content">
	
	      <div class="modal-header">
	        <h5 class="modal-title" id="modal-title"></h5>
	        <button type="button" class="btn-close" data-bs-dismiss="modal" style="margin-right: 20px; margin-top: 10px;"></button>
	      </div>
	
	      <div class="modal-body" id="modal-body">
	        <!-- 내용 -->
	      </div>
	      
	      <div class="modal-body" id="modal_file">
	         	* 첨부 파일 없음 * 
	      </div>
	
	      <div class="modal-footer">
	        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
	          닫기
	        </button>
	      </div>
	
	    </div>
	  </div>
	</div>

	
    <div class="sidenav-overlay"></div>
    <div class="drag-target"></div>
    
    </th:block>
    
</html>
